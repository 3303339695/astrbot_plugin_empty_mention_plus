name: astrbot_plugin_empty_mention_plus
display_name: 空@接话
short_desc: 单独 @ 或只发唤醒词时，把 @ 或唤醒词本身交给模型，保留六十秒等待。
desc: |
  框架原本处理“只 @ 机器人”或“只发一个唤醒词”时，会丢掉 @ 和唤醒词，
  改成一段固定的提示词，并且只等用户下一条消息。

  这个插件在唤醒检查之后接管这几种情况：

  - 单独 @：只把“@机器人”本身交给模型，让模型正常回一句；也可以选择只给称呼；
  - 只发唤醒词：只把唤醒词本身交给模型，不塞固定提示词；
  - 带内容的唤醒词：把被框架剪掉的唤醒词补回去，避免“为什么”这类词被吃掉；
  - 带 @ 的正常内容：照旧去掉 @，不额外处理。

  接管后仍然保留原来的等待时间，等待期间同一个人再发消息会照常接上。
  不会去翻上一条旧消息，避免把不相关的话题接进来。
  命令消息不补唤醒词，避免影响指令识别。
author: 大肥鱼
repo: https://github.com/3303339695/astrbot_plugin_empty_mention_plus
version: 1.2.0
astrbot_version: ">=4.17.0"
